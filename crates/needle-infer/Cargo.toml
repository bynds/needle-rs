[package]
name = "needle-infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Needle inference engine: .cact and SafeTensors loaders, SentencePiece tokenizer, KV cache, constrained decoding"
keywords = ["llm", "inference", "tool-calling", "transformer", "tokenizer"]
categories = ["science", "text-processing"]
readme = "../../README.md"
rust-version.workspace = true
# Parity fixtures are generated from checkpoints that are not distributed with
# the crate, so shipping them would add half a megabyte no consumer can use. The
# tests that read them skip when they are absent.
exclude = ["tests/*_vectors.json", "tests/*.f32"]

[features]
default = []
# Forwards to needle-core's rayon-backed row splitting. Left off by default so
# needle-wasm and embedded consumers are unaffected; native front ends enable it.
parallel = ["needle-core/parallel"]
neon = ["needle-core/neon"]
# Per-operation cost accounting for examples/v3_profile.rs (needle-core/src/prof.rs).
profile = ["needle-core/profile"]

[dependencies]
needle-core = { path = "../needle-core", version = "0.3.1" }

[dev-dependencies]
serde_json = "1"
# examples/v3_profile.rs reads the PMU through perf_event_open.
libc = "0.2"

[[example]]
name = "v3_profile"
required-features = ["profile"]
